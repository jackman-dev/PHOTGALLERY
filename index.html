<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photographer Portfolio</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="public-page">
    <header class="site-header">
      <a class="site-logo" href="./index.html" aria-label="홈">JACKMAN</a>
      <nav aria-label="사이트 메뉴">
        <a href="#gallery">Work</a>
        <a href="#gallery">Portraits</a>
        <a href="#gallery" aria-current="page">Gallery</a>
        <a href="#gallery">Archive</a>
      </nav>
    </header>

    <main>
      <section id="gallery" class="public-gallery-section" aria-label="사진 갤러리">
        <div id="empty-state" class="public-empty">
          <h3>준비 중인 갤러리입니다.</h3>
          <p>새로운 작업물이 곧 소개됩니다.</p>
        </div>

        <div id="public-gallery" class="masonry-gallery" aria-live="polite"></div>
      </section>
    </main>

    <dialog id="photo-dialog" class="photo-dialog public-dialog">
      <button id="close-dialog" class="close-button" type="button" aria-label="닫기">×</button>
      <div class="lightbox-actions" aria-label="사진 이동">
        <button id="prev-photo" class="lightbox-nav" type="button" aria-label="이전 사진">←</button>
        <button id="next-photo" class="lightbox-nav" type="button" aria-label="다음 사진">→</button>
      </div>
      <figure class="lightbox-frame">
        <img id="dialog-image" alt="" />
      </figure>
      <div class="lightbox-brand" aria-hidden="true">JACKMAN</div>
      <div id="photo-counter" class="photo-counter" aria-live="polite">0 / 0</div>
    </dialog>

    <script src="./gallery.js"></script>
  </body>
</html>
